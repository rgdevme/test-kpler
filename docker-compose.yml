name: access-provisioning-portal

x-server-service: &server-service
  image: access-provisioning-portal-server
  environment:
    DATABASE_URL: postgresql://access:access@database:5432/access_portal
    PORT: 3000

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: access_portal
      POSTGRES_PASSWORD: access
      POSTGRES_USER: access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U access -d access_portal"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - database_data:/var/lib/postgresql

  migration:
    <<: *server-service
    command: ["node", "dist/database/run-migrations.js"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  seed:
    <<: *server-service
    command: ["node", "dist/database/seed.js"]
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: "no"

  server:
    <<: *server-service
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      target: server-runtime
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:3000/api/health"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "${API_PORT:-3000}:3000"

  app:
    image: access-provisioning-portal-app
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      target: app-runtime
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  database_data:
